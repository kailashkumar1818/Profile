    <meta
      property="og:title"
      content="Kailash Kumar — Full-Stack Developer & CS Student"

    <!-- Fonts: Inter (body) + Space Grotesk (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kailash Kumar",
        "description": "Computer Science student focused on full-stack web development and problem solving.",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "SRM University AP"
        },
        "knowsAbout": [
          "Web Development",
          "Full-Stack Development",
          "Data Structures",
          "C++",
          "JavaScript"
        ]
      }
    </script>

    <!-- Set the saved theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kailash-theme");
          var isDark = stored ? stored === "dark" : false;
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#24201c" : "#FCF0DA");
        } catch (_) {
          // light stays as default if localStorage unavailable
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
